<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#6366f1">
    <title>NoRegret - Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fafafb; color: #111827; font: 16px system-ui, sans-serif; }
      main { max-width: 420px; padding: 28px; border: 1px solid #e5e7eb; border-radius: 16px; background: white; }
      h1 { margin-top: 0; font-size: 24px; }
      p { color: #6b7280; line-height: 1.5; }
      a { color: #4f46e5; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>NoRegret keeps your app shell available, but private study data is not cached on this device. Reconnect to load or save your latest progress.</p>
      <a href="/today">Try again</a>
    </main>
  </body>
</html>
